<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061329">
  <meta name="description" content="Entrez dans le petit monde des projets de Mateo : des créations à découvrir, une bulle après l'autre.">
  <title>Le petit monde de Mateo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Trebuchet MS", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --ink: #e4f5ff;
      --muted: #9fc6e6;
      --aqua: #83eaff;
      --glass-border: rgba(155, 220, 255, .35);
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; }

    body {
      position: relative;
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 112%, rgba(0, 125, 210, .17), transparent 48%),
        radial-gradient(ellipse at 10% 10%, rgba(17, 62, 119, .12), transparent 34%),
        radial-gradient(ellipse at 90% 42%, rgba(39, 30, 108, .1), transparent 34%),
        linear-gradient(155deg, #030916 0%, #07152c 44%, #0a2040 74%, #061329 100%);
    }

    a { color: inherit; }

    .page {
      width: min(1080px, calc(100% - 48px));
      min-height: 100vh;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #def3ff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.035em;
      text-decoration: none;
    }

    .brand-mark {
      position: relative;
      display: grid;
      width: 35px;
      height: 35px;
      place-items: center;
      overflow: hidden;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(145deg, #d9fcff 0%, #57d5ff 33%, #1475d1 68%, #263a9d 100%);
      box-shadow: inset -4px -5px 8px rgba(4, 27, 83, .48), 0 0 15px rgba(45, 166, 255, .28);
      color: white;
      font-size: 16px;
      text-shadow: 0 1px 3px rgba(27, 103, 156, .38);
    }

    .brand-mark::before {
      position: absolute;
      top: 3px;
      left: 6px;
      width: 18px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,.72);
      content: "";
      filter: blur(2px);
      transform: rotate(-25deg);
    }

    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      padding: 7px 0 7px 7px;
      color: #a9c5df;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .github-link:hover, .github-link:focus-visible {
      color: #d5f4ff;
      text-shadow: 0 0 14px rgba(77,196,255,.42);
      outline: none;
    }

    .github-link svg { width: 16px; height: 16px; }

    main {
      display: grid;
      min-height: calc(100vh - 142px);
      align-items: center;
      padding: 20px 0;
    }

    .world {
      width: 100%;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      min-height: 60vh;
      align-items: center;
      justify-items: center;
      gap: clamp(20px, 5vw, 64px);
      padding: 25px 0;
    }

    .project-card {
      display: flex;
      width: 100%;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
    }

    .bubble-shell {
      display: grid;
      width: 216px;
      height: 216px;
      place-items: center;
      animation: drift 6s ease-in-out infinite;
    }

    .project-card:nth-child(2) .bubble-shell {
      width: 230px;
      height: 230px;
      animation-delay: -2.8s;
    }

    .bubble {
      position: relative;
      display: grid;
      width: 186px;
      height: 186px;
      place-items: center;
      overflow: hidden;
      border: 0;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 27% 15%, rgba(227,252,255,.56) 0%, rgba(135,221,255,.2) 10%, transparent 35%),
        radial-gradient(ellipse at 76% 84%, rgba(15,67,167,.47), transparent 43%),
        linear-gradient(145deg, #356e9c 0%, #123d74 28%, #071d48 57%, #050e2a 100%);
      box-shadow:
        inset 2px 3px 9px rgba(224,250,255,.35),
        inset -15px -19px 30px rgba(0,3,24,.72),
        inset 8px 7px 20px rgba(186,235,255,.11),
        0 16px 32px rgba(0,6,26,.4),
        0 0 28px rgba(53,153,255,.1);
      transition: transform .32s cubic-bezier(.2,.8,.2,1), box-shadow .32s ease, filter .32s ease;
    }

    .bubble::before {
      position: absolute;
      z-index: 2;
      top: 13px;
      left: 27px;
      width: 78px;
      height: 27px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(229,252,255,.82), rgba(124,217,255,.08));
      content: "";
      filter: blur(2px);
      transform: rotate(-31deg);
      pointer-events: none;
    }

    .bubble::after {
      position: absolute;
      z-index: 2;
      right: 15px;
      bottom: 32px;
      width: 19px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(90deg, transparent, rgba(172,239,255,.6), transparent);
      content: "";
      filter: blur(3px);
      transform: rotate(-24deg);
      transition: transform .32s ease, opacity .32s ease;
      pointer-events: none;
    }

    .bubble-art {
      position: relative;
      z-index: 1;
      display: grid;
      width: 116px;
      height: 116px;
      place-items: center;
      border: 0;
      border-radius: 33px;
      background: transparent;
      box-shadow: none;
      transform: rotate(-5deg);
      transition: transform .32s cubic-bezier(.2,.8,.2,1);
      backdrop-filter: blur(3px);
    }

    .bubble-art svg { width: 88px; height: 88px; overflow: visible; }

    .project-card:nth-child(2) .bubble {
      width: 198px;
      height: 198px;
      background:
        radial-gradient(ellipse at 27% 15%, rgba(245,227,255,.55) 0%, rgba(178,139,255,.2) 10%, transparent 35%),
        radial-gradient(ellipse at 76% 84%, rgba(105,42,164,.5), transparent 43%),
        linear-gradient(145deg, #654b9c 0%, #3d347b 30%, #1e2258 58%, #101639 100%);
      box-shadow:
        inset 2px 3px 9px rgba(240,227,255,.34),
        inset -15px -19px 30px rgba(4,3,28,.72),
        inset 8px 7px 20px rgba(216,185,255,.11),
        0 16px 32px rgba(4,3,27,.44),
        0 0 28px rgba(177,93,255,.12);
    }

    .project-card:nth-child(2) .bubble-art {
      width: 124px;
      height: 124px;
      transform: rotate(5deg);
    }

    .project-card:nth-child(3) .bubble {
      background:
        radial-gradient(ellipse at 27% 15%, rgba(224,255,240,.56) 0%, rgba(135,255,203,.2) 10%, transparent 35%),
        radial-gradient(ellipse at 76% 84%, rgba(12,109,112,.5), transparent 43%),
        linear-gradient(145deg, #438c87 0%, #155c62 29%, #083847 58%, #051b30 100%);
      box-shadow:
        inset 2px 3px 9px rgba(224,255,245,.33),
        inset -15px -19px 30px rgba(0,15,23,.72),
        inset 8px 7px 20px rgba(186,255,229,.1),
        0 16px 32px rgba(0,18,24,.44),
        0 0 28px rgba(65,236,198,.11);
    }

    .project-card:nth-child(3) .bubble-art {
      transform: rotate(-2deg);
    }

    .project-card:hover .bubble, .project-card:focus-visible .bubble {
      transform: scale(1.075);
      filter: saturate(1.13) brightness(1.035);
      box-shadow:
        inset 2px 4px 10px rgba(255,255,255,.66),
        inset -16px -20px 30px rgba(47,117,197,.34),
        0 21px 40px rgba(0,7,28,.56),
        0 0 34px rgba(59,184,255,.34);
    }

    .project-card:hover .bubble::after, .project-card:focus-visible .bubble::after {
      opacity: .8;
      transform: translate(-12px,-8px) rotate(-24deg) scale(1.2);
    }

    .project-card:hover .bubble-art, .project-card:focus-visible .bubble-art {
      transform: rotate(0) scale(1.06);
    }

    .project-card:active .bubble { transform: scale(.94); }

    .project-card:focus-visible { outline: 2px solid rgba(142,234,255,.64); outline-offset: 8px; border-radius: 50%; }

    .project-name {
      margin-top: 7px;
      color: #e0f4ff;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.035em;
      text-shadow: 0 0 13px rgba(61,181,255,.28);
      transition: color .2s ease, transform .2s ease;
    }

    .project-card:hover .project-name, .project-card:focus-visible .project-name {
      transform: translateY(-2px);
      color: #8deaff;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 20px 0 25px;
      color: #8eafce;
      font-size: 11px;
    }

    footer a {
      color: #b9eaff;
      font-weight: 700;
      text-decoration: none;
      transition: color .2s ease;
    }

    footer a:hover, footer a:focus-visible { color: #79e7ff; }

    @keyframes drift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-11px); }
    }

    @media (max-width: 640px) {
      .page { width: min(100% - 36px, 480px); }
      header { padding: 18px 0; }
      main { min-height: calc(100vh - 132px); padding: 12px 0; }
      .project-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); min-height: 65vh; gap: 14px 0; }
      .project-card:nth-child(3) { grid-column: 1 / -1; width: min(100%, 195px); }
      .bubble-shell, .project-card:nth-child(2) .bubble-shell, .project-card:nth-child(3) .bubble-shell { width: 170px; height: 181px; }
      .bubble, .project-card:nth-child(2) .bubble, .project-card:nth-child(3) .bubble { width: 148px; height: 148px; }
      .bubble-art { width: 94px; height: 94px; border-radius: 27px; }
      .bubble-art svg { width: 72px; height: 72px; }
      .project-card:nth-child(2) .bubble-art, .project-card:nth-child(3) .bubble-art { width: 98px; height: 98px; }
      .project-name { font-size: 14px; text-align: center; }
    }

    @media (max-width: 390px) {
      .project-grid { gap: 0; }
      .bubble-shell, .project-card:nth-child(2) .bubble-shell, .project-card:nth-child(3) .bubble-shell { width: 145px; height: 166px; }
      .bubble, .project-card:nth-child(2) .bubble, .project-card:nth-child(3) .bubble { width: 132px; height: 132px; }
      .bubble-art { width: 84px; height: 84px; }
      .bubble-art svg { width: 64px; height: 64px; }
      .project-card:nth-child(2) .bubble-art, .project-card:nth-child(3) .bubble-art { width: 88px; height: 88px; }
      .github-link { padding: 7px 0 7px 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="/" aria-label="Accueil — Mateo">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>Le petit monde de Mateo</span>
      </a>

              <span class="bubble">

    <footer>
      <span>Fait avec un peu de magie par Mateo.</span>
      <a href="https://github.com/mateo-llr" target="_blank" rel="noopener noreferrer">github.com/mateo-llr ↗</a>

</body>
</html>
