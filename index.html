<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a5fb8">
  <meta name="description" content="Les projets de Mateo : des créations à découvrir.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
  <title>Mateo</title>
  <style>
    :root {
      font-family: "Fredoka", "Varela Round", "Arial Rounded MT Bold", "Trebuchet MS", ui-rounded, system-ui, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --white: #ffffff;
      --label-shadow: 0 1px 10px rgba(0, 70, 150, .55), 0 0 2px rgba(0, 50, 120, .35);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      position: relative;
      min-width: 320px;
      margin: 0;
      overflow: hidden;
      color: var(--white);
      /* Dégradé de base type PSP : bleu profond en haut, cyan clair en bas */
      background: linear-gradient(180deg, #0c3c9c 0%, #1f68be 28%, #2b9bd8 58%, #12b1e2 100%);
    }

    a { color: inherit; }

    /* ---------- Fond animé ---------- */
    #waves {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Voile de lumière très doux par-dessus */
    .glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 45% at 50% 108%, rgba(160, 235, 255, .35), transparent 70%),
        radial-gradient(ellipse 60% 40% at 50% -10%, rgba(0, 20, 90, .35), transparent 70%);
    }

    /* ---------- Mise en page ---------- */
    .page {
      position: relative;
      z-index: 1;
      pointer-events: none; /* laisse passer les clics vers les bulles de fond */
      display: flex;
      min-height: 100%;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: flex-end;
      padding: 22px clamp(18px, 4vw, 40px);
    }

    .github-link {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border: 1px solid rgba(255, 255, 255, .38);
      border-radius: 999px;
      background: rgba(255, 255, 255, .14);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      color: rgba(255, 255, 255, .92);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: .02em;
      text-decoration: none;
      text-shadow: var(--label-shadow);
      transition: background .3s ease, box-shadow .3s ease, transform .3s ease;
    }

    .github-link svg { width: 15px; height: 15px; }

    .github-link:hover, .github-link:focus-visible {
      background: rgba(255, 255, 255, .26);
      box-shadow: 0 0 22px rgba(255, 255, 255, .35);
      outline: none;
    }

    main {
      display: grid;
      flex: 1;
      place-items: center;
      padding: 0 clamp(14px, 4vw, 40px) 9vh;
    }

    /* ---------- Menu façon XMB ---------- */
    .menu {
      display: flex;
      width: 100%;
      max-width: 900px;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(18px, 6vw, 80px);
    }

    .item {
      pointer-events: auto;
      display: flex;
      width: clamp(92px, 28vw, 260px);
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      transition: opacity .4s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .tile-wrap {
      animation: float 7s ease-in-out infinite;
    }
    .item:nth-child(2) .tile-wrap { animation-delay: -2.3s; }
    .item:nth-child(3) .tile-wrap { animation-delay: -4.6s; }

    /* Bulle de savon Frutiger Aero : centre transparent, liseré irisé bleu/vert */
    .tile {
      position: relative;
      display: grid;
      width: clamp(88px, 24vw, 150px);
      aspect-ratio: 1;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .02) 55%, rgba(190, 240, 255, .16) 78%, rgba(255, 255, 255, .28) 100%);
      box-shadow:
        inset 0 0 18px rgba(255, 255, 255, .22),
        inset 6px 8px 18px rgba(255, 255, 255, .16),
        inset -8px -10px 20px rgba(120, 255, 210, .18),
        0 10px 26px rgba(0, 70, 150, .2);
      transition: transform .5s cubic-bezier(.2, .8, .2, 1), box-shadow .5s ease, background .5s ease;
    }

    /* liseré irisé (anneau fin dégradé bleu -> vert -> blanc) */
    .tile::before {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 200deg,
        rgba(255, 255, 255, .95), rgba(150, 215, 255, .85) 14%, rgba(50, 120, 235, .95) 30%,
        rgba(90, 235, 190, .95) 48%, rgba(210, 255, 235, .7) 60%, rgba(120, 190, 255, .8) 78%,
        rgba(255, 255, 255, .95));
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 3.5px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 3.5px));
      content: "";
      opacity: .9;
      pointer-events: none;
    }

    /* reflets : croissant en haut à gauche + lueur verte en bas à droite */
    .tile::after {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(ellipse 38% 19% at 30% 15%, rgba(255, 255, 255, 1), rgba(255, 255, 255, 0) 100%),
        radial-gradient(circle 4% at 21% 30%, rgba(255, 255, 255, .9), transparent 100%),
        radial-gradient(ellipse 30% 12% at 72% 88%, rgba(150, 255, 215, .6), transparent 100%),
        radial-gradient(circle at 50% 50%, transparent 66%, rgba(255, 255, 255, .22) 100%);
      content: "";
      pointer-events: none;
    }

    .tile svg {
      position: relative;
      width: 52%;
      height: 52%;
      overflow: visible;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, .75)) drop-shadow(0 2px 6px rgba(0, 70, 150, .35));
      transition: transform .45s cubic-bezier(.2, .8, .2, 1);
    }

    .label {
      max-width: 100%;
      margin-top: 20px;
      color: #fff;
      font-size: clamp(17px, 4.4vw, 26px);
      font-weight: 600;
      letter-spacing: .01em;
      line-height: 1.2;
      text-align: center;
      /* contour bleu + reflet blanc + halo cyan, comme le logo Frutiger Aero */
      -webkit-text-stroke: .2em #1a62c8;
      paint-order: stroke fill;
      text-shadow:
        0 2px 0 rgba(10, 60, 150, .55),
        0 0 14px rgba(120, 230, 255, .85),
        0 4px 12px rgba(0, 50, 140, .45);
      transition: transform .45s cubic-bezier(.2, .8, .2, 1), text-shadow .45s ease;
    }

    /* Effet "sélection" : l'élément actif grossit et brille, les autres s'estompent */
    .menu:hover .item, .menu:focus-within .item { opacity: .8; }
    .menu:hover .item:hover, .menu:focus-within .item:focus-visible { opacity: 1; }

    .item:hover .tile, .item:focus-visible .tile {
      transform: translateY(-6px) scale(1.1);
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .08) 50%, rgba(190, 240, 255, .28) 78%, rgba(255, 255, 255, .4) 100%);
      box-shadow:
        inset 0 0 22px rgba(255, 255, 255, .35),
        inset 6px 8px 18px rgba(255, 255, 255, .22),
        inset -8px -10px 22px rgba(120, 255, 210, .28),
        0 16px 38px rgba(0, 70, 160, .26),
        0 0 44px rgba(200, 245, 255, .6);
    }

    .item:hover .tile svg, .item:focus-visible .tile svg { transform: scale(1.06); }

    .item:hover .label, .item:focus-visible .label {
      transform: translateY(2px);
      text-shadow:
        0 2px 0 rgba(10, 60, 150, .55),
        0 0 22px rgba(170, 245, 255, 1),
        0 4px 12px rgba(0, 50, 140, .45);
    }

    .item:active .tile { transform: scale(1.0); }

    .item:focus-visible { outline: none; }

    /* petites bulles décoratives qui montent doucement */
    .bg-bubble {
      position: fixed;
      z-index: 0;
      bottom: -80px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 58%, rgba(200,240,255,.22) 100%);
      box-shadow: inset 0 0 0 1.5px rgba(190, 235, 255, .7), inset -3px -4px 6px rgba(130, 255, 215, .35);
      pointer-events: auto;
      cursor: pointer;
      animation: rise linear infinite;
    }
    .bg-bubble::before { position: absolute; inset: -8px; border-radius: 50%; content: ""; }
    .bg-bubble::after {
      position: absolute;
      top: 14%; left: 20%;
      width: 34%; height: 18%;
      border-radius: 50%;
      background: rgba(255, 255, 255, .85);
      filter: blur(.5px);
      transform: rotate(-30deg);
      content: "";
    }

    /* éclatement d'une bulle du menu */
    .item.popping { pointer-events: none; }
    .item.popping .tile { animation: popTile .38s cubic-bezier(.2, .7, .3, 1) forwards; }
    .item.popping .label { opacity: .55; transition: opacity .3s ease; }
    @keyframes popTile {
      0%   { transform: translateY(-6px) scale(1.1); opacity: 1; }
      35%  { transform: translateY(-6px) scale(1.3); opacity: 1; }
      100% { transform: translateY(-6px) scale(1.45); opacity: 0; }
    }

    /* effet d'éclatement : anneau + gouttelettes */
    .pop-fx { position: fixed; z-index: 5; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
    .pop-ring {
      position: absolute;
      border: 2px solid rgba(255, 255, 255, .95);
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(190, 240, 255, .9), inset 0 0 10px rgba(150, 255, 215, .5);
    }
    .pop-drop {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff 0 25%, rgba(200, 240, 255, .55) 60%, rgba(120, 255, 215, .35) 100%);
      box-shadow: 0 0 6px rgba(200, 245, 255, .8);
    }

    .bubble-score {
      position: fixed;
      z-index: 10;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 14px;
      border: 2px solid #000;
      border-radius: 4px;
      background: rgba(0, 0, 0, .28);
      color: #fff;
      font-family: "Press Start 2P", "Courier New", monospace;
      font-size: clamp(10px, 2vw, 14px);
      line-height: 1.5;
      text-align: center;
      -webkit-text-stroke: .5px #000;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
    }

    .bubble-score.is-appearing {
      animation: score-appear .55s cubic-bezier(.2, .8, .25, 1) both;
    }

    @keyframes score-appear {
      0% { opacity: 0; transform: translate(-50%, -10px) scale(.92); }
      68% { opacity: 1; transform: translate(-50%, 2px) scale(1.035); }
      100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }

    @keyframes rise {
      from { transform: translate(0, 0); opacity: 0; }
      10% { opacity: .9; }
      to { transform: translate(var(--dx, 20px), -115vh); opacity: .2; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @media (max-width: 420px) {
      .menu { gap: 10px; }
      .item { width: 30%; }
      .label { margin-top: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="waves" aria-hidden="true"></canvas>
  <div class="glow" aria-hidden="true"></div>
  <div class="bubble-score" id="bubble-score" role="status" aria-live="polite" hidden></div>

  <div class="page">
    <header>
      <a class="github-link" href="https://github.com/mateo-llr" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

  <script>
    (function () {
      var canvas = document.getElementById('waves');
      var ctx = canvas.getContext('2d');
      var w = 0, h = 0, dpr = 1;
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Rubans translucides : position, amplitude, épaisseur, vitesse, sens du dégradé
      var ribbons = [
        { y: .20, amp: .060, thick: .22, k: 1.1, sp: .050, ph: 0.0, edge: .55, flip: false },
        { y: .46, amp: .075, thick: .16, k: 1.4, sp: .062, ph: 1.7, edge: .50, flip: true  },
        { y: .64, amp: .060, thick: .20, k: 0.9, sp: .045, ph: 3.1, edge: .42, flip: false },
        { y: .88, amp: .045, thick: .16, k: 1.3, sp: .058, ph: 4.6, edge: .40, flip: true  }
      ];

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function center(r, x, t) {
        var u = x / w * Math.PI * 2 * r.k;
        return h * (r.y
          + r.amp * Math.sin(u + r.ph + t * r.sp * 6)
          + r.amp * .45 * Math.sin(u * 1.9 - r.ph * .7 + t * r.sp * 4.2));
      }

      function thick(r, x, t) {
        var u = x / w * Math.PI * 2;
        return h * r.thick * (0.62 + 0.38 * Math.sin(u * .8 + r.ph * 1.3 + t * r.sp * 3));
      }

      function draw(t) {
        ctx.clearRect(0, 0, w, h);
        var step = Math.max(6, Math.round(w / 180));

        for (var i = 0; i < ribbons.length; i++) {
          var r = ribbons[i], top = [], bot = [], minY = h, maxY = 0, x, y1, y2;

          for (x = 0; x <= w + step; x += step) {
            y1 = center(r, x, t);
            y2 = y1 + thick(r, x, t);
            top.push(y1); bot.push(y2);
            if (y1 < minY) minY = y1;
            if (y2 > maxY) maxY = y2;
          }

          ctx.beginPath();
          var n = top.length;
          ctx.moveTo(0, top[0]);
          for (var a = 1; a < n; a++) ctx.lineTo(a * step, top[a]);
          for (var b = n - 1; b >= 0; b--) ctx.lineTo(b * step, bot[b]);
          ctx.closePath();

          var g = ctx.createLinearGradient(0, minY, 0, maxY);
          var s = r.edge;
          if (!r.flip) {
            g.addColorStop(0, 'rgba(255,255,255,' + s * .75 + ')');
            g.addColorStop(.18, 'rgba(235,248,255,' + s * .32 + ')');
            g.addColorStop(1, 'rgba(255,255,255,0)');
          } else {
            g.addColorStop(0, 'rgba(255,255,255,0)');
            g.addColorStop(.78, 'rgba(235,248,255,' + s * .26 + ')');
            g.addColorStop(1, 'rgba(255,255,255,' + s * .7 + ')');
          }
          ctx.fillStyle = g;
          ctx.fill();

          // liseré lumineux le long du bord brillant (halo en 3 passes)
          var edgeArr = r.flip ? bot : top;
          var widths = [9, 4, 1.4], alphas = [.05, .1, .38];
          for (var p = 0; p < 3; p++) {
            ctx.beginPath();
            ctx.moveTo(0, edgeArr[0]);
            for (var q = 1; q < n; q++) ctx.lineTo(q * step, edgeArr[q]);
            ctx.lineWidth = widths[p];
            ctx.lineJoin = 'round';
            ctx.strokeStyle = 'rgba(255,255,255,' + alphas[p] * (s / .5) + ')';
            ctx.stroke();
          }
        }
      }

      function loop(ms) {
        draw(ms / 1000);
        requestAnimationFrame(loop);
      }

      resize();
      window.addEventListener('resize', function () { resize(); if (reduce) draw(8); });

      if (reduce) draw(8);
      else requestAnimationFrame(loop);
    })();
  </script>

  <script>
    (function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var popSound = new Audio('bubble.mp3');
      var scoreElement = document.getElementById('bubble-score');
      var poppedBubbles = 0;
      var konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a', 'Enter'];
      var konamiPosition = 0;

      function playPopSound() {
        var sound = popSound.cloneNode();
        sound.playbackRate = .92 + Math.random() * .16;
        sound.play().catch(function (error) {
          console.error('Impossible de lire le son de bulle.', error);
        });
      }

      function countPoppedBubble() {
        poppedBubbles++;
        if (!scoreElement.hidden) scoreElement.textContent = 'BULLES ÉCLATÉES : ' + poppedBubbles;
      }

      window.addEventListener('keydown', function (event) {
        if (event.repeat) return;
        var key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        if (key === konamiCode[konamiPosition]) {
          konamiPosition++;
          if (konamiPosition === konamiCode.length) {
            event.preventDefault();
            scoreElement.textContent = 'BULLES ÉCLATÉES : ' + poppedBubbles;
            scoreElement.hidden = false;
            requestAnimationFrame(function () { scoreElement.classList.add('is-appearing'); });
            konamiPosition = 0;
          }
        } else {
          konamiPosition = key === konamiCode[0] ? 1 : 0;
        }
      });

      /* Effet d'éclatement : anneau qui s'étend + gouttelettes qui jaillissent */
      function burst(x, y, r) {
        if (reduce) return;
        var fx = document.createElement('div');
        fx.className = 'pop-fx';
        fx.style.transform = 'translate(' + x + 'px,' + y + 'px)';

        var ring = document.createElement('div');
        ring.className = 'pop-ring';
        ring.style.cssText = 'left:' + (-r) + 'px;top:' + (-r) + 'px;width:' + (r * 2) + 'px;height:' + (r * 2) + 'px';
        fx.appendChild(ring);
        ring.animate(
          [{ transform: 'scale(.92)', opacity: .95 }, { transform: 'scale(1.35)', opacity: 0 }],
          { duration: 420, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' }
        );

        var n = r > 40 ? 16 : 8;
        for (var i = 0; i < n; i++) {
          var d = document.createElement('div');
          var sz = (r > 40 ? 5 : 3) + Math.random() * (r > 40 ? 9 : 5);
          var ang = (i / n) * Math.PI * 2 + Math.random() * .5;
          var dist = r * (.95 + Math.random() * .9);
          var tx = Math.cos(ang) * dist, ty = Math.sin(ang) * dist;
          d.className = 'pop-drop';
          d.style.cssText = 'left:' + (Math.cos(ang) * r * .9 - sz / 2) + 'px;top:' + (Math.sin(ang) * r * .9 - sz / 2) + 'px;width:' + sz + 'px;height:' + sz + 'px';
          fx.appendChild(d);
          d.animate(
            [{ transform: 'translate(0,0) scale(1)', opacity: 1 },
             { transform: 'translate(' + (tx - Math.cos(ang) * r * .9) + 'px,' + (ty - Math.sin(ang) * r * .9 + 14) + 'px) scale(.3)', opacity: 0 }],
            { duration: 480 + Math.random() * 300, easing: 'cubic-bezier(.15,.7,.3,1)', fill: 'forwards' }
          );
        }
        document.body.appendChild(fx);
        setTimeout(function () { fx.remove(); }, 900);
      }

      /* Clic sur une bulle du menu : elle éclate, puis on change de page */
      var items = document.querySelectorAll('.item');
      items.forEach(function (item) {
        item.addEventListener('click', function (e) {
          if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
          e.preventDefault();
          var url = item.href;
          playPopSound();
          countPoppedBubble();
          if (reduce) { window.location.href = url; return; }
          var tile = item.querySelector('.tile').getBoundingClientRect();
          item.classList.add('popping');
          burst(tile.left + tile.width / 2, tile.top + tile.height / 2, tile.width / 2);
          setTimeout(function () { window.location.href = url; }, 520);
        });
      });

      /* Retour arrière : on remet la bulle en place */
      window.addEventListener('pageshow', function () {
        items.forEach(function (i) { i.classList.remove('popping'); });
      });

      if (reduce) return;

      /* Bulles de fond : elles montent, on peut les éclater */
      function spawn(initial) {
        var b = document.createElement('span');
        var size = 18 + Math.random() * 40;
        b.className = 'bg-bubble';
        b.setAttribute('aria-hidden', 'true');
        b.style.cssText = 'left:' + (Math.random() * 100) + '%;width:' + size + 'px;height:' + size + 'px;' +
          'animation-duration:' + (22 + Math.random() * 26) + 's;' +
          'animation-delay:-' + (initial ? Math.random() * 40 : 0) + 's;' +
          '--dx:' + ((Math.random() - .5) * 120) + 'px';
        b.addEventListener('animationend', function () { b.remove(); spawn(false); });
        b.addEventListener('pointerdown', function (e) {
          e.preventDefault();
          var r = b.getBoundingClientRect();
          playPopSound();
          countPoppedBubble();
          burst(r.left + r.width / 2, r.top + r.height / 2, r.width / 2);
          b.remove();
          setTimeout(function () { spawn(false); }, 1500 + Math.random() * 2500);
        });
        document.body.appendChild(b);
      }

      var n = window.innerWidth < 600 ? 7 : 12;
      for (var i = 0; i < n; i++) spawn(true);
    })();
  </script>
</body>
</html>
